# Testadmin (Content Forge editor). The classic login form is on testadmin;
# after login the editor opens on cftestadmin.
# ADMIN_USERNAME and ADMIN_PASSWORD override the account below.

admin.login.url=https://testadmin.xataka.com/login
admin.editor.url=https://cftestadmin.xataka.com/
admin.username=admin
admin.password=ColtIcNorc
browser=chrome
# Headed for now so the login flow can be watched.
# browser.headless=true
browser.headless=false

# New superevento. Publishing it is not required before a shot can be created.
superevento.create.url=https://cftestadmin.xataka.com/post/new?type=superevent

# ---------------------------------------------------------------------------
# Login — ids from the testadmin form (#user-login)
# The account name "admin" is typed into #username. There is no element id "admin".
# ---------------------------------------------------------------------------
login.username.id=username
login.password.id=password
login.submit.id=_submit
login.form.id=user-login
login.error.xpath=//p[contains(@class,'message') and contains(@class,'error')]

# Editor shell
editor.app.id=app

# ---------------------------------------------------------------------------
# Superevento — Datos tab
# The title textarea sits in Title_moduleTitleContainer. Its placeholder is
# "Título..." until the post type is superevent, then "Título del superevento...".
# Dates are MUI date fields labelled in Spanish.
# Stored value is YYYY-MM-DD; the field is typed as dd/mm/aaaa.
# ---------------------------------------------------------------------------
superevento.title.xpath=//div[contains(@class,'Title_moduleTitleContainer')]//textarea
superevento.startDate.xpath=//label[contains(normalize-space(.),'Fecha de inicio')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.startTime.xpath=//label[contains(normalize-space(.),'Hora de inicio')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.endDate.xpath=//label[contains(normalize-space(.),'Fecha de fin')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.endTime.xpath=//label[contains(normalize-space(.),'Hora de fin')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.location.xpath=//label[contains(normalize-space(.),'Localización')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.hashtag.xpath=//label[contains(normalize-space(.),'Hashtag')]/ancestor::*[contains(@class,'MuiFormControl')][1]//input
superevento.startDate.calendar.xpath=//button[@aria-label='Fecha de inicio (*)']
superevento.endDate.calendar.xpath=//button[@aria-label='Fecha de fin']
superevento.dateError.xpath=//p[contains(@class,'MuiFormHelperText-root') and contains(@class,'Mui-error')]
superevento.savedStatus.xpath=//*[normalize-space(.)='Guardado']

# Header tabs. Publishing the superevento (PUBLICACIÓN) is optional.
tab.datos.xpath=//*[@role='tab' and contains(normalize-space(.),'DATOS')]
tab.emision.xpath=//button[@role='tab'][contains(normalize-space(.),'EMISI')]
tab.tabla.xpath=//*[@role='tab' and starts-with(normalize-space(.),'Tabla')]
tab.publicacion.xpath=//*[@role='tab' and contains(normalize-space(.),'PUBLICACIÓN')]
superevento.closedMessage.xpath=//*[contains(normalize-space(.),'Seguimiento terminado')]

# ---------------------------------------------------------------------------
# Emisión — shot form (spec 2.6.2)
# ---------------------------------------------------------------------------
shot.tab.xpath=//button[@type='button' and @title='Crear nuevo shot']
shot.editor.xpath=//div[contains(@class,'editorSection')]
shot.content.xpath=//div[contains(@class,'editorSection')]//*[@contenteditable='true' or @role='textbox']
shot.placeholder.xpath=//*[normalize-space(.)='Escribe aquí...']
shot.publish.xpath=//button[normalize-space(.)='PUBLICAR YA']
shot.schedule.xpath=//button[@title='Programar' or @aria-label='Programar']
shot.newShot.xpath=//button[normalize-space(.)='NUEVO SHOT']
shot.delete.xpath=//button[@title='Eliminar' or @aria-label='Eliminar']
shot.toDraft.xpath=//button[@title='Pasar a borrador' or @aria-label='Pasar a borrador']
shot.preview.xpath=//button[@title='Vista previa' or @aria-label='Vista previa']
shot.scheduleTime.xpath=//label[normalize-space(.)='Hora']/ancestor::*[contains(@class,'MuiFormControl')][1]//input
shot.scheduleConfirm.xpath=//button[normalize-space(.)='PROGRAMAR']
shot.chooseSlot.xpath=//button[normalize-space(.)='ELEGIR HUECO' or normalize-space(.)='CERRAR']
shot.stickyToolbar.xpath=//*[@data-testid='micropost-sticky-toolbar']
shot.shortcuts.xpath=//div[contains(@class,'option')][contains(.,'[b]old')]
shot.emptyDraftMessage.xpath=//*[contains(normalize-space(.),'Nada que guardar') or contains(normalize-space(.),'No se puede guardar un borrador vacío')]
shot.publishedMessage.xpath=//*[contains(normalize-space(.),'Publicado correctamente') or normalize-space(.)='Publicado']

# ---------------------------------------------------------------------------
# Emisión — render groups (spec 2.6.6)
# Group headers are buttons whose text is the group name plus the count.
# ---------------------------------------------------------------------------
render.published.xpath=//button[starts-with(normalize-space(.),'Publicados')]
render.scheduled.xpath=//button[starts-with(normalize-space(.),'Programados')]
render.drafts.xpath=//button[starts-with(normalize-space(.),'Borradores')]
render.fold.xpath=//button[@aria-label='Plegar' or @title='Plegar']
render.unfold.xpath=//button[@aria-label='Desplegar' or @title='Desplegar']
render.goToDay.xpath=//button[contains(normalize-space(.),'IR AL DÍA')]
render.day.xpath=//div[starts-with(@id,'group-day-')]
render.expandAll.xpath=//*[normalize-space(.)='Ver todo desplegado']
render.onlyMine.xpath=//*[normalize-space(.)='Ver sólo tus contenidos']

# Slots table (data-testid values from the scheduler)
slots.refresh.xpath=//*[@data-testid='button-refresh']
slots.today.xpath=//*[@data-testid='button-today']
slots.goToDate.xpath=//*[@data-testid='button-go_to_date']
slots.previous.xpath=//*[@data-testid='button-prev']
slots.next.xpath=//*[@data-testid='button-next']
